name: Apply compact catalog and model spacing

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-compact-catalog-spacing.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct migration regression expectation
        run: python fix_compact_spacing_test.py
      - name: Apply compact catalog and spacing
        run: python apply_compact_catalog_spacing.py
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.py catalog_publisher.py tests/test_prices.py tests/test_catalog.py
          git diff --cached --check
          git commit -m "Add model spacing and compact catalog"
          git push origin HEAD:main
