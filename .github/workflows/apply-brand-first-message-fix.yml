name: Apply brand and first-message fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-brand-first-message-fix.yml
      - scripts/apply_brand_first_message_fix.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply fixes
        run: python scripts/apply_brand_first_message_fix.py
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.py catalog_publisher.py tests/test_prices.py tests/test_catalog.py
          git diff --cached --check
          git commit -m "Fix product categories, Samsung buttons and first message"
          git push origin HEAD:main
