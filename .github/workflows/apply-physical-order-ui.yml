name: Apply physical block order UI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-physical-order-ui.yml
      - apply_physical_order_ui.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply physical order UI
        run: python apply_physical_order_ui.py
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.py control_catalog.py tests/test_catalog.py tests/test_prices.py
          git diff --cached --check
          git commit -m "Order current physical price messages by number"
          git pull --rebase origin main
          git push origin HEAD:main
