name: Apply physical block order UI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-physical-order-ui.yml
      - apply_physical_order_ui.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix migration quoting
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apply_physical_order_ui.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace("    '''    def _draft_order(self, user_id):", "    r'''    def _draft_order(self, user_id):", 1)
          s = s.replace("new_handle = '''    async def handle_message(self, message):", "new_handle = r'''    async def handle_message(self, message):", 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Apply physical order UI
        run: python apply_physical_order_ui.py
      - name: Fix test helper import
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_prices.py')
          s = p.read_text(encoding='utf-8')
          if not s.startswith('import re\n'):
              s = 'import re\n' + s
          p.write_text(s, encoding='utf-8')
          PY
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.py control_catalog.py tests/test_catalog.py tests/test_prices.py
          git diff --cached --check
          git commit -m "Order current physical price messages by number"
          git pull --rebase origin main
          git push origin HEAD:main
