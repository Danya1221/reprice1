name: Apply catalog button refresh

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-catalog-button-refresh.yml
      - apply_catalog_button_refresh.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply catalog refresh
        run: python apply_catalog_button_refresh.py
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog_publisher.py tests/test_catalog.py
          git diff --cached --check
          git commit -m "Refresh catalog buttons from physical post headings"
          git pull --rebase origin main
          git push origin HEAD:main
