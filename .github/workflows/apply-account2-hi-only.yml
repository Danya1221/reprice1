name: Apply account 2 HI only

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-account2-hi-only.yml
      - apply_account2_hi_only.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply account 2 source restriction
        run: python apply_account2_hi_only.py
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime.py control_botapi.py tests/test_dual_accounts.py
          git diff --cached --check
          git commit -m "Limit second Telegram account to HI supplier"
          git pull --rebase origin main
          git push origin HEAD:main
