name: Apply exact Samsung A-series parsing

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-samsung-a-exact.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Samsung A-series fix
        run: python apply_samsung_a_exact.py
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.py tests/test_prices.py
          git diff --cached --check
          git commit -m "Recognize only A17 A27 A37 A57 as Galaxy A"
          git push origin HEAD:main
