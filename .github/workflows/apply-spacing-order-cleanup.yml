name: Apply final price layout cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-spacing-order-cleanup.yml
      - apply_spacing_order_cleanup.py
      - fix_layout_test_expectations.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply layout cleanup
        run: |
          python apply_spacing_order_cleanup.py
          python fix_layout_test_expectations.py
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.py tests/test_prices.py tests/test_complete_prices.py tests/test_catalog.py
          git diff --cached --check
          git commit -m "Polish spacing iPhone order and Samsung memory groups"
          git push origin HEAD:main
