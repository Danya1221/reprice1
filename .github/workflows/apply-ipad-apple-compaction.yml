name: Apply iPad and Apple compaction

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-ipad-apple-compaction.yml
      - apply_ipad_and_apple_compaction.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply fix
        run: python apply_ipad_and_apple_compaction.py
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.py tests/test_prices.py
          git diff --cached --check
          git commit -m "Parse supplier iPads and keep Apple sections together"
          git pull --rebase origin main
          git push origin HEAD:main
