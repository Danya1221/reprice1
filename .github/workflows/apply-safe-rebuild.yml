name: Apply safe price rebuild

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-safe-rebuild.yml
      - apply_safe_rebuild.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply safe rebuild fix
        run: python apply_safe_rebuild.py
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot_publisher.py runtime.py tests/test_bot_publisher.py tests/test_runtime.py
          git diff --cached --check
          git commit -m "Make price rebuild atomic and guard rendered item count"
          git pull --rebase origin main
          git push origin HEAD:main
