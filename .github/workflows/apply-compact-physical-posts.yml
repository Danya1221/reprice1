name: Apply compact physical price posts

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-compact-physical-posts.yml
      - apply_compact_physical_posts.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply compact post changes
        run: python apply_compact_physical_posts.py
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.py catalog_publisher.py tests/test_prices.py tests/test_parser_regressions.py tests/test_catalog.py
          git diff --cached --check
          git commit -m "Pack price blocks into larger Telegram messages"
          git push origin HEAD:main
