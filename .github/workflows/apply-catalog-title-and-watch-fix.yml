name: Apply catalog title and watch brand fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-catalog-title-and-watch-fix.yml
      - apply_catalog_title_and_watch_fix.py
      - apply_catalog_title_and_watch_fix_v2.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply fixes
        run: python apply_catalog_title_and_watch_fix_v2.py
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.py catalog_publisher.py tests/test_catalog.py tests/test_watch_branding.py
          git diff --cached --check
          git commit -m "Use post titles for catalog and fix watch brands"
          git pull --rebase origin main
          git push origin HEAD:main
