name: Fix iPhone 11-15 order

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-iphone-11-15-order.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply ascending iPhone 11-15 section order
        run: |
          python - <<'PY'
          from pathlib import Path

          prices = Path('prices.py')
          text = prices.read_text(encoding='utf-8')
          old = '''                if bundle == "iphone17":
                    bundle_sections.sort(key=lambda entry: iphone_bundle_section_rank(entry["title"]))
'''
          new = '''                if bundle in {"iphone11-15", "iphone17"}:
                    bundle_sections.sort(key=lambda entry: iphone_bundle_section_rank(entry["title"]))
'''
          if old not in text:
              raise SystemExit('iPhone bundle sorting block not found')
          prices.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('tests/test_prices.py')
          text = tests.read_text(encoding='utf-8')
          marker = '''    def test_iphone17_visual_order_is_17e_air_pro_pro_max(self):
'''
          test = '''    def test_iphone_11_to_15_visual_order_is_ascending(self):
        items = self.parse("""iPhone 15 Pro Max 256 Black — 84000\niPhone 15 128 Blue — 48800\niPhone 14 512 Blue — 54300\niPhone 13 128 Midnight — 45200\niPhone 12 128 White — 33600\niPhone 11 128 Black — 30000""").items
        content = next(iter(render_blocks(items, Settings()).values()))
        positions = [content.index(label) for label in ["— iPhone 11 —", "— iPhone 12 —", "— iPhone 13 —", "— iPhone 14 —", "— iPhone 15 —"]]
        self.assertEqual(positions, sorted(positions))
        self.assertTrue(content.startswith("<b>iPhone 11 / 12 / 13 / 14 / 15</b>"))

'''
          if 'def test_iphone_11_to_15_visual_order_is_ascending' not in text:
              if marker not in text:
                  raise SystemExit('test insertion marker not found')
              text = text.replace(marker, test + marker, 1)
          tests.write_text(text, encoding='utf-8')
          PY
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.py tests/test_prices.py
          git diff --cached --check
          git commit -m "Keep iPhone 11 through 15 in ascending order"
          git pull --rebase origin main
          git push origin HEAD:main
