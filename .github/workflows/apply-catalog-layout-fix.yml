name: Apply catalog layout fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-catalog-layout-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply fixes
        run: python scripts/apply_catalog_layout_fix.py
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog_publisher.py control_catalog.py prices.py tests/test_catalog.py tests/test_prices.py
          git diff --cached --check
          git commit -m "Keep catalog last and show all block ordering"
          git push origin HEAD:main
