name: Apply Apple Watch shorthand models

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-apple-watch-short-models.yml
      - apply_apple_watch_short_models.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Apple Watch shorthand fix
        run: python apply_apple_watch_short_models.py
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.py tests/test_watch_branding.py
          git diff --cached --check
          git commit -m "Recognize supplier Apple Watch shorthand"
          git pull --rebase origin main
          git push origin HEAD:main
