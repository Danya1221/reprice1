name: Fix price parser classification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-price-parser.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply parser fixes
        run: python scripts/apply_price_parser_fix.py
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.py catalog_publisher.py tests/test_prices.py tests/test_catalog.py tests/test_complete_prices.py tests/test_display_format.py tests/test_parser_regressions.py
          git diff --cached --check
          git commit -m "Fix price classification and SIM parsing"
          git push origin HEAD:main
