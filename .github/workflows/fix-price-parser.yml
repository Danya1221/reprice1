name: Fix price parser classification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-price-parser.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply parser fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, got {count}")
              return text.replace(old, new, 1)

          path = Path('prices.py')
          text = path.read_text(encoding='utf-8')

          text = replace_once(
              text,
              'SHORT_IPHONE = re.compile(r"^(\\d{1,2}(?:e)?(?:\\s+(?:pro\\s+max|pro|plus|mini))?)\\s+(?=\\d{2,4}\\s*(?:gb|tb|гб|тб)?\\b)", re.I)',
              'SHORT_IPHONE = re.compile(r"^(\\d{1,2}(?:e)?(?:\\s+(?:pro\\s+max|pro|plus|mini|air))?)\\s+(?=\\d{1,4}\\s*(?:gb|tb|гб|тб)?\\b)", re.I)',
              'short iPhone 1TB/2TB/Air',
          )

          text = replace_once(
              text,
              '    ("Ray-Ban Meta", r"ray[\\s-]?ban|wayfarer|skyler"),\n',
              '    ("Ray-Ban Meta", r"ray[\\s-]?ban|wayfarer|skyler"),\n    ("Oura Ring", r"\\boura(?:\\s+ring)?\\b"),\n',
              'Oura brand',
          )
          text = replace_once(
              text,
              '    ("Xiaomi", r"\\bxiaomi\\b|\\bredmi\\b|\\bpoco\\b"),',
              '    ("Xiaomi", r"\\bxiaomi\\b|\\bredmi\\b|\\bpoco\\b|^\\s*(?:redmi\\s+)?note\\s+\\d{1,2}\\b"),',
              'bare Redmi Note family',
          )

          old_region = '''# Apple: iPhone 17-family devices bought in these markets are eSIM-only.\n# This fallback is used only when the supplier did not explicitly specify SIM.\nESIM_ONLY_17_FLAGS = {\n    "🇺🇸", "🇻🇮", "🇬🇺", "🇨🇦", "🇯🇵", "🇦🇪",\n    "🇸🇦", "🇶🇦", "🇰🇼", "🇴🇲", "🇧🇭", "🇲🇽",\n}\n\n\n'''
          text = replace_once(text, old_region, '', 'remove region SIM flags')

          text = replace_once(
              text,
              '        r"\\b(?:nano\\s*)?sim\\s*(?:\\+|/|&|and|и)\\s*esim\\b|"\n        r"\\besim\\s*(?:\\+|/|&|and|и)\\s*(?:nano\\s*)?sim\\b",',
              '        r"\\b(?:1\\s*)?(?:nano\\s*)?sim\\s*(?:\\+|/|&|and|и)\\s*esim\\b|"\n        r"\\besim\\s*(?:\\+|/|&|and|и)\\s*(?:1\\s*)?(?:nano\\s*)?sim\\b",',
              '1Sim+eSim recognition',
          )

          old_model = '''    words = [x if re.fullmatch(r"\\d+e?", x, re.I) else x.title() for x in suffix.split()]\n    return "iPhone " + " ".join(words)\n\n\ndef iphone17_family(model):\n    model = clean(model).casefold()\n    return model == "iphone air" or model.startswith("iphone 17")\n\n\ndef infer_iphone17_sim(title, model, current="unknown"):\n    """Infer the iPhone 17 SIM layout from Apple regional rules and price flags."""\n    if current != "unknown" or not iphone17_family(model):\n        return current\n    lower_model = clean(model).casefold()\n    if lower_model == "iphone air":\n        return "esim"\n    flags = set(FLAGS.findall(title))\n    if not flags:\n        return current\n    if flags & ESIM_ONLY_17_FLAGS:\n        return "esim"\n    # Mainland-China iPhone 17 / Pro / Pro Max use two physical nano-SIMs.\n    # iPhone 17e is the exception and supports physical nano-SIM/eSIM.\n    if "🇨🇳" in flags and not lower_model.startswith("iphone 17e"):\n        return "dual"\n    return "hybrid"\n\n\n'''
          new_model = '''    words = [x if re.fullmatch(r"\\d+e?", x, re.I) else x.title() for x in suffix.split()]\n    model = " ".join(words)\n    if model.casefold() == "17 air":\n        return "iPhone Air"\n    return "iPhone " + model\n\n\n'''
          text = replace_once(text, old_model, new_model, 'iPhone Air and remove region inference')

          old_product_block = '''def product_block(title):\n    for label in ("AirPods", "Apple Watch", "iPad", "MacBook", "iMac", "Mac mini", "Mac Studio", "Apple TV", "AirTag"):\n        if re.search(r"\\b" + re.escape(label) + r"\\b", title, re.I):\n            return label\n    return brand_of(title)\n\n\ndef ordered_blocks(blocks, preferred=()):\n    defaults = ["iPhone", "AirPods", "Apple Watch", "iPad", "MacBook", "Apple", "Ray-Ban Meta",\n                "Samsung", "Honor", "Realme", "Huawei", "Tecno", "Xiaomi", "Google", "Dyson",\n                "CPO", "ASIS", "Аксессуары", "Товары"]\n    def order_key(name):\n        if name in preferred:\n            return (-1, preferred.index(name), (), "")\n        model = iphone_model(name)\n        family = "iPhone" if model else name\n        rank = defaults.index(family) if family in defaults else len(defaults) - 4\n        number = re.search(r"\\d+", model)\n        return (rank, -int(number[0]) if number else 0, tuple(int(x) if x.isdigit() else x for x in re.split(r"(\\d+)", name.casefold())), name)\n    return sorted(set(blocks), key=order_key)\n'''
          new_product_block = '''def apple_watch_block(title):\n    if not re.search(r"\\b(?:apple\\s*)?watch\\b", title, re.I):\n        return ""\n    ultra = re.search(r"\\bultra(?:\\s*(\\d{1,2}))?\\b", title, re.I)\n    if ultra:\n        return "Apple Watch Ultra" + (" " + ultra.group(1) if ultra.group(1) else "")\n    series = re.search(r"\\b(?:series|s)\\s*(\\d{1,2})\\b", title, re.I)\n    if series:\n        return "Apple Watch Series " + series.group(1)\n    se = re.search(r"\\bse(?:\\s*(\\d{1,2}))?\\b", title, re.I)\n    if se:\n        return "Apple Watch SE" + (" " + se.group(1) if se.group(1) else "")\n    return "Apple Watch"\n\n\ndef product_block(title):\n    watch = apple_watch_block(title)\n    if watch:\n        return watch\n    if re.search(r"\\b(?:MacBook|iMac)\\b", title, re.I):\n        return "MacBook / iMac"\n    for label in ("AirPods", "iPad", "Mac mini", "Mac Studio", "Apple TV", "AirTag"):\n        if re.search(r"\\b" + re.escape(label) + r"\\b", title, re.I):\n            return label\n    return brand_of(title)\n\n\ndef ordered_blocks(blocks, preferred=()):\n    defaults = ["iPhone", "AirPods", "Apple Watch", "iPad", "MacBook / iMac", "Apple", "Ray-Ban Meta",\n                "Samsung", "Honor", "Realme", "Huawei", "Tecno", "Xiaomi", "Google", "Dyson",\n                "Oura Ring", "CPO", "ASIS", "Аксессуары", "Товары"]\n    def order_key(name):\n        if name in preferred:\n            return (-1, preferred.index(name), (), "")\n        model = iphone_model(name)\n        family = "iPhone" if model else ("Apple Watch" if name.startswith("Apple Watch") else name)\n        rank = defaults.index(family) if family in defaults else len(defaults) - 4\n        numbered = model if model else (name if family == "Apple Watch" else "")\n        number = re.search(r"\\d+", numbered)\n        return (rank, -int(number[0]) if number else 0, tuple(int(x) if x.isdigit() else x for x in re.split(r"(\\d+)", name.casefold())), name)\n    return sorted(set(blocks), key=order_key)\n'''
          text = replace_once(text, old_product_block, new_product_block, 'watch/mac grouping and block order')

          old_from_dict = '''    @classmethod\n    def from_dict(cls, value):\n        return cls(**{**value, "price": Decimal(value["price"])})\n'''
          new_from_dict = '''    @classmethod\n    def from_dict(cls, value):\n        data = {**value, "price": Decimal(value["price"])}\n        # Repair old persisted rows that were classified before the parser learned\n        # about short iPhones, Redmi Note, Oura, Watch series and the combined Mac block.\n        data["title"] = normal_title(data["title"])\n        if data.get("block") not in {"ASIS", "CPO", "Аксессуары"}:\n            known = iphone_model(data["title"]) or product_block(data["title"])\n            if known:\n                data["block"] = known\n        return cls(**data)\n'''
          text = replace_once(text, old_from_dict, new_from_dict, 'repair persisted rows')

          text = replace_once(
              text,
              '            elif is_header and re.fullmatch(r"(?:2\\s*)?(?:e[\\s-]?)?sim(?:\\s*[+/]\\s*(?:e[\\s-]?)?sim)?", line, re.I):',
              '            elif is_header and re.fullmatch(r"(?:[12]\\s*)?(?:e[\\s-]?)?sim(?:\\s*[+/&]\\s*(?:[12]\\s*)?(?:e[\\s-]?)?sim)?", line, re.I):',
              'SIM section header',
          )
          text = replace_once(
              text,
              '        if model:\n            sim = infer_iphone17_sim(title, model, sim)\n',
              '',
              'remove country flag SIM fallback',
          )
          text = replace_once(
              text,
              '        header = "<b>— " + html.escape(block) + " —</b>"',
              '        header = "<b>" + html.escape(block) + "</b>"',
              'plain top-level heading',
          )
          path.write_text(text, encoding='utf-8')

          catalog = Path('catalog_publisher.py')
          ctext = catalog.read_text(encoding='utf-8')
          ctext = replace_once(
              ctext,
              'def page_title(content):\n    match = re.match(r"<b>— (.*?) —</b>", content)\n    return html.unescape(match[1]) if match else "Прайс"',
              'def page_title(content):\n    match = re.match(r"<b>\\s*(?:—\\s*)?(.*?)(?:\\s*—)?\\s*</b>", content)\n    return html.unescape(match[1]) if match else "Прайс"',
              'catalog plain headings',
          )
          catalog.write_text(ctext, encoding='utf-8')

          tests = Path('tests/test_prices.py')
          t = tests.read_text(encoding='utf-8')
          old = '''    def test_country_flag_infers_iphone17_sim(self):\n        item = self.parse("🇺🇸 iPhone 17 256GB Black — 58800").items[0]\n        self.assertEqual(item.sim, "esim")\n        self.assertEqual(len(select_items([item], Settings(sim_filter="esim"))), 1)\n\n    def test_iphone17_region_sim_matrix(self):\n        items = self.parse("""🇺🇸 iPhone 17 256 Black — 60000\n🇯🇵 iPhone 17 Pro 256 Black — 70000\n🇦🇪 iPhone 17 Pro Max 256 Black — 80000\n🇨🇳 iPhone 17 256 Black — 61000\n🇮🇳 iPhone 17 256 Black — 62000\n🇭🇰 iPhone 17 Pro 256 Black — 71000\n🇨🇳 iPhone 17e 256 Black — 50000""").items\n        self.assertEqual([item.sim for item in items], [\n            "esim", "esim", "esim", "dual", "hybrid", "hybrid", "hybrid"\n        ])\n\n    def test_explicit_sim_beats_region_fallback(self):\n'''
          new = '''    def test_country_flag_does_not_infer_iphone17_sim(self):\n        item = self.parse("🇺🇸 iPhone 17 256GB Black — 58800").items[0]\n        self.assertEqual(item.sim, "unknown")\n        self.assertEqual(len(select_items([item], Settings(sim_filter="esim"))), 0)\n\n    def test_supplier_sim_markers_drive_iphone17_variants(self):\n        items = self.parse("""iPhone 17\nSIM + eSIM\n17 256 Black 🇮🇳 — 62000\neSIM\n17 Pro 256 Black 🇺🇸 — 70000\n2 SIM\n17 Pro Max 256 Black 🇨🇳 — 80000""").items\n        self.assertEqual([item.sim for item in items], ["hybrid", "esim", "dual"])\n\n    def test_explicit_sim_marker_is_used(self):\n'''
          t = replace_once(t, old, new, 'replace regional SIM tests')
          t = t.replace('self.assertTrue(any("— CPO —" in page for page in contents))', 'self.assertTrue(any("<b>CPO</b>" in page for page in contents))')
          t = t.replace('self.assertTrue(any("— ASIS —" in page for page in contents))', 'self.assertTrue(any("<b>ASIS</b>" in page for page in contents))')

          marker = '\n\nif __name__ == "__main__":\n'
          extra = r'''
    def test_1sim_plus_esim_is_hybrid(self):
        items = self.parse("""iPhone 17
1Sim+eSim
17 256 Black — 60000
iPhone 17 Pro 256 White (1Sim+eSim) — 70000""").items
        self.assertEqual([item.sim for item in items], ["hybrid", "hybrid"])
        content = "\n".join(render_blocks(items, Settings()).values())
        self.assertIn("SIM + eSIM", content)

    def test_short_iphone_tb_and_air_blocks(self):
        items = self.parse("""17 Pro 1TB Orange — 100000
17 Pro Max 2TB Silver — 120000
17 Air 1TB Blue — 90000""").items
        self.assertEqual([item.block for item in items], ["iPhone 17 Pro", "iPhone 17 Pro Max", "iPhone Air"])
        self.assertTrue(all(item.title.startswith("iPhone ") for item in items))

    def test_redmi_note_and_oura_do_not_inherit_dji_context(self):
        items = self.parse("""DJI
Osmo Pocket 3 — 38000
Note 17 8/256 Black — 21900
Oura Ring 4 Silver — 35000""").items
        self.assertEqual([item.block for item in items], ["DJI / Insta360", "Xiaomi", "Oura Ring"])
        self.assertNotIn("DJI Note", items[1].title)
        self.assertNotIn("DJI Oura", items[2].title)

    def test_watch_series_and_macs_are_grouped(self):
        items = self.parse("""Apple Watch
Series 11 46mm Jet Black — 40000
Ultra 3 49mm Black — 70000
MacBook Air M4 16/256 — 90000
iMac M4 24 16/256 — 110000""").items
        self.assertEqual([item.block for item in items], [
            "Apple Watch Series 11", "Apple Watch Ultra 3", "MacBook / iMac", "MacBook / iMac"
        ])
        pages = "\n".join(render_blocks(items, Settings()).values())
        self.assertIn("<b>MacBook / iMac</b>", pages)
        self.assertNotIn("<b>— MacBook / iMac —</b>", pages)

    def test_saved_bad_blocks_are_reclassified(self):
        saved = Item.from_dict({
            "title": "Oura Ring 4 Silver", "price": "35000", "currency": "RUB",
            "block": "DJI / Insta360", "sim": "unknown", "accessory": False,
        })
        self.assertEqual(saved.block, "Oura Ring")
'''
          if marker not in t:
              raise SystemExit('test insertion marker not found')
          t = t.replace(marker, '\n' + extra + marker, 1)
          tests.write_text(t, encoding='utf-8')
          PY

      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.py catalog_publisher.py tests/test_prices.py
          git diff --cached --check
          git commit -m "Fix price classification and SIM parsing"
          git push origin HEAD:main
